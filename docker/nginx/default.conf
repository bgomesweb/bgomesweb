server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Vue.js SPA (static build)
    root /usr/share/nginx/html;
    index index.html;

    # Public files exposed by Laravel (resume, certificate PDFs, etc.)
    location /storage/ {
        alias /var/www/html/public/storage/;
        try_files $uri =404;
    }

    # Laravel API — every request under /api is handled by the front controller
    location /api/ {
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # Vue Router history mode fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
