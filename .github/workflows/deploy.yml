name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend (Vue SPA)
        working-directory: frontend
        run: npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.CPANEL_SSH_PORT }}" "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload frontend build to public_html
        run: |
          rsync -az --delete \
            --exclude 'backend-app' \
            --exclude 'storage' \
            --exclude 'cgi-bin' \
            --exclude '.well-known' \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT }} -i ~/.ssh/deploy_key" \
            frontend/dist/ \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_PUBLIC_HTML_PATH }}/"

      - name: Upload backend code (Laravel)
        run: |
          rsync -az --delete \
            --exclude '.env' \
            --exclude 'vendor' \
            --exclude 'node_modules' \
            --exclude 'storage/logs' \
            -e "ssh -p ${{ secrets.CPANEL_SSH_PORT }} -i ~/.ssh/deploy_key" \
            backend/ \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}:${{ secrets.CPANEL_BACKEND_PATH }}/"

      - name: Install dependencies and run migrations on server
        env:
          PHP_BIN: ${{ secrets.CPANEL_PHP_BIN }}
          COMPOSER_BIN: ${{ secrets.CPANEL_COMPOSER_BIN }}
          BACKEND_PATH: ${{ secrets.CPANEL_BACKEND_PATH }}
        run: |
          ssh -p "${{ secrets.CPANEL_SSH_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.CPANEL_SSH_USER }}@${{ secrets.CPANEL_SSH_HOST }}" \
            "set -e; cd '$BACKEND_PATH'; \
             '$COMPOSER_BIN' install --no-dev --optimize-autoloader --no-interaction; \
             '$PHP_BIN' artisan migrate --force; \
             '$PHP_BIN' artisan config:clear; \
             '$PHP_BIN' artisan config:cache; \
             '$PHP_BIN' artisan route:clear; \
             '$PHP_BIN' artisan route:cache; \
             chmod -R 775 storage bootstrap/cache"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
